spring.application.name=task-management-system
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/task_manager
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres1234!}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (use env JWT_SECRET in production; must be at least 32 characters for HS256)
app.jwt.secret=${JWT_SECRET:taskmanager-jwt-secret-key-min-32-chars-required}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
